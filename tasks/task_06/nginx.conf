events {
    worker_connections 1024;
}

http {
    upstream shop {
        server 127.0.0.1:9100;
    }

    # Сервер HTTP (порт 80) — редирект на HTTPS[cite: 7]
    server {
        listen 80;
        server_name shop.lab.test;
        return 301 https://$host$request_uri;
    }

    # Сервер HTTPS (порт 443)[cite: 7]
    server {
        listen 443 ssl;
        server_name shop.lab.test;

        ssl_certificate /etc/ssl/lab/shop.crt;
        ssl_certificate_key /etc/ssl/lab/shop.key;

        # Точний шлях /health повертає код 200 і текст ok (латиницею)[cite: 7]
        location = /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Проксування /api/ на бекенд із заміною префікса на /v2/[cite: 7]
        location /api/ {
            proxy_pass http://127.0.0.1:9200/v2/;
        }

        # Статичні файли /assets/ із каталогу /srv/shop[cite: 7]
        location /assets/ {
            root /srv/shop;
        }

        # Основний проксі для решти запитів[cite: 7]
        location / {
            proxy_pass http://shop;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}